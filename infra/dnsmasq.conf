# Servidor DHCP + DNS da rede da Vinheria Agnello (equivalente às funções DHCP e DNS do Windows Server)
interface=br-vinheria
bind-interfaces
domain=vinheria.local
local=/vinheria.local/
expand-hosts

# ---- DHCP ----
dhcp-range=10.10.0.100,10.10.0.150,255.255.255.0,12h
dhcp-option=option:router,10.10.0.1
dhcp-option=option:dns-server,10.10.0.1
dhcp-option=option:domain-name,vinheria.local
# reservas (o equivalente a "Reservations" no console DHCP do Windows)
dhcp-host=02:00:0a:0a:00:0a,catalogo,10.10.0.10
dhcp-host=02:00:0a:0a:00:0b,pedidos,10.10.0.11
dhcp-authoritative
dhcp-leasefile=/tmp/vinheria-dnsmasq.leases

# ---- DNS ----
# os nomes recebidos via DHCP são registrados automaticamente na zona vinheria.local
# (equivalente ao "registro dinâmico" do DNS do Windows integrado ao DHCP)
address=/gateway.vinheria.local/10.10.0.1
cname=api.vinheria.local,pedidos.vinheria.local
no-resolv
log-queries
log-dhcp
